<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Recreación UChile - Registrar Actividad</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <main class="container">
            <header>
                <h1>Registrar Actividad</h1>
            </header>
            <div id="val-box-actividades" class="validation-box" hidden>
                <h2 id="val-msg-actividades" class="validation-message"></h2>
                <ul id="val-list-actividades" class="validation-list"></ul>
            </div>
            <form id="ActividadesForm" name="ActividadesForm" class="formulario" action="#" method="post">
                <h2>Información de la Actividad</h2>
                <div class="grupo-input">
                    <label for="name">Nombre de la Actividad:</label>
                    <input id="name" name="name" type="text">
                </div>
                <div class="grupo-input">
                    <label for="description">Descripción:</label>
                    <textarea id="description" name="description" rows="4" class="no-resize"></textarea>
                </div>
                <div class="grupo-input">
                    <label for="date">Fecha:</label>
                    <input id="date" name="date" type="date">
                </div>
                <div class="grupo-input">
                    <label for="time-start">Hora de Inicio:</label>
                    <input id="time-start" name="time-start" type="time">
                </div>
                <div class="grupo-input">
                    <label for="time-end">Hora de Término:</label>
                    <input id="time-end" name="time-end" type="time">
                </div>
                <div class="grupo-input">
                    <label for="tipo">Tipo de Actividad:</label>
                    <select id="tipo" name="tipo">
                        <option value="">-- Seleccione un tipo --</option>
                        <option value="Artistica">Artística</option>
                        <option value="Deportiva">Deportiva</option>
                        <option value="Tecnologica">Tecnológica</option>
                        <option value="Social">Social</option>
                        <option value="General">General</option>
                    </select>
                </div>
                <div class="grupo-input">
                    <label for="file">Subir Foto o Video:</label>
                    <input id="file" name="file" type="file" accept="image/*,video/*">
                </div>
                <div class="grupo-input">
                    <label for="link">Link de la Actividad:</label>
                    <input id="link" name="link" type="url">
                </div>
                <div class="botones">
                    <button type="button" id="envio-actividades" onclick="validarFormActividades()">
                        Enviar
                    </button>
                    <a href="listado.html" class="btn-volver">Volver</a>
                </div>
            </form>
        </main>
        <script src="validador.js"></script>
    </body>
</html>
