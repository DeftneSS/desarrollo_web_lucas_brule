<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Recreación UChile - Estadísticas</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <main class="container">
            <header>
                <h1>Estadísticas</h1>
            </header>
            <nav class="navegacion">
                <a href="listado.html" class="btn-registro">Volver al Listado</a>
            </nav>

            <section class="stats-container">
                <article class="chart-box">
                    <h2>Miembros por Tipo</h2>
                    <img src="cake_graph.jpg" alt="Distribución de miembros por tipo" class="chart-img">
                </article>

                <article class="chart-box">
                    <h2>Actividades por Tipo</h2>
                    <img src="bar_graph.jpg" alt="Gráfico de actividades por tipo" class="chart-img">
                </article>

                <article class="chart-box">
                    <h2>Distribución de Actividades</h2>
                    <img src="grafico_torta.jpg" alt="Gráfico de torta de actividades" class="chart-img">
                </article>
            </section>
        </main>
    </body>
</html>
