<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8"/>
        <title>Recreación UChile</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <main class="container">
            <h1>Registro de Usuario</h1>
            <div id="val-box-registro" class="validation-box" hidden>
                <h2 id="val-msg-registro" class="validation-message"></h2>
                <ul id="val-list-registro" class="validation-list"></ul>
            </div>
            <form name="myForm" class="formulario" action="#" method="POST">
                <h2>Información Personal</h2>
                <div id="name-input" class="grupo-input">
                    <label for="name">Nombre de Usuario:</label>
                    <input id="name" name="name" type="text" required>
                </div>
                <div id="lastname-input" class="grupo-input">
                    <label for="lastname">Apellido:</label>
                    <input id="lastname" name="lastname" type="text" required>
                </div>
                <div id="email-input" class="grupo-input">
                    <label for="email">Correo Electrónico:</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div id="phone-input" class="grupo-input">
                    <label for="phone">Número de Teléfono:</label>
                    <input id="phone" name="phone" type="tel" required>
                </div>
                <div id="password-input" class="grupo-input">
                    <label for="password">Contraseña (mínimo 6 caracteres):</label>
                    <input id="password" name="password" type="password" required>
                </div>
                <div class="grupo-input">
                    <label for="type">Tipo de Usuario:</label>
                    <select id="type" name="type" required>
                        <option value="">-- Seleccione un tipo --</option>
                        <option value="Pregrado">Pregrado</option>
                        <option value="Postgrado">Postgrado</option>
                        <option value="Funcionario">Funcionario</option>
                        <option value="Academico">Academico</option>
                    </select>
                </div>
                <div class="botones">
                    <button type="button" id="envio" onclick="validarFormRegistro()">
                        Registrar
                    </button>
                </div  >
            </form>
        </main>
        <script src="validador.js"></script>
    </body>
</html>
