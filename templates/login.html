<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Recreación UChile - Iniciar Sesión</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <main class="container">
            <header>
                <h1>Iniciar Sesión</h1>
            </header>

            {% if error %}
                <div class="validation-box" style="background:#f8d7da;border:1px solid #721c24;color:#721c24;padding:15px;margin-bottom:20px;border-radius:5px;">
                    <p>{{ error }}</p>
                </div>
            {% endif %}

            <form name="loginForm" class="formulario" action="{{ url_for('login') }}" method="POST">
                <div class="grupo-input">
                    <label for="email">Correo Electrónico:</label>
                    <input id="email" name="email" type="email" value="{{ email }}">
                </div>
                <div class="grupo-input">
                    <label for="password">Contraseña:</label>
                    <input id="password" name="password" type="password">
                </div>
                <div class="botones">
                    <button type="submit">Entrar</button>
                    <a href="{{ url_for('index') }}" class="btn-volver">Volver</a>
                </div>
            </form>

            <p style="margin-top:15px;">
                ¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a>.
            </p>
        </main>
    </body>
</html>
