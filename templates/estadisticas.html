<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Recreación UChile - Estadísticas</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <main class="container">
            <header>
                <h1>Estadísticas</h1>
            </header>
            <nav class="navegacion">
                <a href="{{ url_for('listado') }}" class="btn-registro">Volver al Listado</a>
                <a href="{{ url_for('index') }}" class="btn-registro">Volver al Inicio</a>
            </nav>
            <section class="stats-container">
                <article class="chart-box">
                    <h2>Miembros por Tipo</h2>
                    <img src="{{ url_for('static', filename='cake_graph.jpg') }}" alt="Distribución de miembros por tipo" class="chart-img">
                </article>

                <article class="chart-box">
                    <h2>Actividades por Tipo</h2>
                    <img src="{{ url_for('static', filename='bar_graph.jpg') }}" alt="Gráfico de actividades por tipo" class="chart-img">
                </article>

                <article class="chart-box">
                    <h2>Distribución de Actividades</h2>
                    <img src="{{ url_for('static', filename='grafico_torta.jpg') }}" alt="Gráfico de torta de actividades" class="chart-img">
                </article>
            </section>
        </main>
    </body>
</html>
