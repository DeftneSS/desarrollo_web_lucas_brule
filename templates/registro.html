<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"/>
        <title>Recreación UChile - Registro</title>
        <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles.css') }}">
    </head>
    <body>
        <main class="container">
            <header>
                <h1>Registro de Usuario</h1>
            </header>

            {% if errores %}
                <div id="val-box-registro" class="validation-box" style="background:#f8d7da;border:1px solid #721c24;color:#721c24;padding:15px;margin-bottom:20px;border-radius:5px;">
                    <h2 style="color:#721c24;font-size:1.1em;margin-bottom:10px;">Los siguientes campos son inválidos:</h2>
                    <ul style="color:#721c24;list-style-position:inside;">
                        {% for e in errores %}<li>{{ e }}</li>{% endfor %}
                    </ul>
                </div>
            {% endif %}
            <div id="val-box-registro" class="validation-box" hidden>
                <h2 id="val-msg-registro" class="validation-message"></h2>
                <ul id="val-list-registro" class="validation-list"></ul>
            </div>

            <form name="myForm" id="myForm" class="formulario" action="{{ url_for('registro') }}" method="POST">
                <h2>Información Personal</h2>
                <div class="grupo-input">
                    <label for="name">Nombre:</label>
                    <input id="name" name="name" type="text" value="{{ form_data.get('name', '') }}">
                </div>
                <div class="grupo-input">
                    <label for="lastname">Apellido:</label>
                    <input id="lastname" name="lastname" type="text" value="{{ form_data.get('lastname', '') }}">
                </div>
                <div class="grupo-input">
                    <label for="email">Correo Electrónico:</label>
                    <input id="email" name="email" type="email" value="{{ form_data.get('email', '') }}">
                </div>
                <div class="grupo-input">
                    <label for="phone">Número de Teléfono:</label>
                    <input id="phone" name="phone" type="tel" value="{{ form_data.get('phone', '') }}">
                </div>
                <div class="grupo-input">
                    <label for="password">Contraseña (mínimo 6 caracteres):</label>
                    <input id="password" name="password" type="password">
                </div>
                <div class="grupo-input">
                    <label for="region_id">Región:</label>
                    <select id="region_id" name="region_id" onchange="filtrarComunas()">
                        <option value="">-- Seleccione una región --</option>
                        {% for r in regiones %}
                            <option value="{{ r.id }}" {% if form_data.get('region_id')|string == r.id|string %}selected{% endif %}>{{ r.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="grupo-input">
                    <label for="comuna_id">Comuna:</label>
                    <select id="comuna_id" name="comuna_id" data-selected="{{ form_data.get('comuna_id', '') }}">
                        <option value="">-- Seleccione una comuna --</option>
                    </select>
                </div>
                <script id="comunas-data" type="application/json">
                    [{% for c in comunas %}{"id":{{ c.id }},"nombre":{{ c.nombre|tojson }},"region_id":{{ c.region_id }}}{% if not loop.last %},{% endif %}{% endfor %}]
                </script>

                <div class="grupo-input">
                    <label for="type">Tipo de Usuario:</label>
                    <select id="type" name="type" onchange="mostrarCamposPorTipo()">
                        <option value="">-- Seleccione un tipo --</option>
                        <option value="Pregrado" {% if form_data.get('type') == 'Pregrado' %}selected{% endif %}>Pregrado</option>
                        <option value="Postgrado" {% if form_data.get('type') == 'Postgrado' %}selected{% endif %}>Postgrado</option>
                        <option value="Funcionario" {% if form_data.get('type') == 'Funcionario' %}selected{% endif %}>Funcionario</option>
                        <option value="Academico" {% if form_data.get('type') == 'Academico' %}selected{% endif %}>Académico</option>
                    </select>
                </div>

                <section id="campos-estudiante" class="campos-condicionales" hidden>
                    <div class="grupo-input">
                        <label for="carrera">Carrera:</label>
                        <input id="carrera" name="carrera" type="text" value="{{ form_data.get('carrera', '') }}">
                    </div>
                    <div class="grupo-input">
                        <label for="anio-ingreso">Año de Ingreso:</label>
                        <input id="anio-ingreso" name="anio-ingreso" type="number" min="1900" max="2030" value="{{ form_data.get('anio-ingreso', '') }}">
                    </div>
                </section>

                <section id="campos-funcionario" class="campos-condicionales" hidden>
                    <div class="grupo-input">
                        <label for="departamento">Departamento:</label>
                        <input id="departamento" name="departamento" type="text" value="{{ form_data.get('departamento', '') }}">
                    </div>
                    <div class="grupo-input">
                        <label for="cargo">Cargo:</label>
                        <input id="cargo" name="cargo" type="text" value="{{ form_data.get('cargo', '') }}">
                    </div>
                </section>

                <section id="campos-academico" class="campos-condicionales" hidden>
                    <div class="grupo-input">
                        <label for="area">Área de Investigación:</label>
                        <input id="area" name="area" type="text" value="{{ form_data.get('area', '') }}">
                    </div>
                    <div class="grupo-input">
                        <label for="grado">Grado Académico:</label>
                        <select id="grado" name="grado">
                            <option value="">-- Seleccione --</option>
                            <option value="Licenciado" {% if form_data.get('grado') == 'Licenciado' %}selected{% endif %}>Licenciado</option>
                            <option value="Magister" {% if form_data.get('grado') == 'Magister' %}selected{% endif %}>Magíster</option>
                            <option value="Doctor" {% if form_data.get('grado') == 'Doctor' %}selected{% endif %}>Doctor</option>
                        </select>
                    </div>
                </section>

                <div class="botones">
                    <button type="button" id="envio" onclick="validarFormRegistro()">Registrar</button>
                    <a href="{{ url_for('index') }}" class="btn-volver">Volver</a>
                </div>
            </form>
        </main>
        <script src="{{ url_for('static', filename='validador.js') }}"></script>
        <script>
            mostrarCamposPorTipo();
            filtrarComunas();
        </script>
    </body>
</html>
