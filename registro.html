<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Recreación UChile</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <main class="container">
            <h1>Registro de Usuario</h1>
            <form class="formulario" action="">
                <legend>Información Personal</legend>
                <div id="name-input" class="grupo-input">
                    <label for="name">Nombre de Usuario:</label>
                    <input id="name" name="name" type="text" required>
                </div>
                <div id="lastname-input" class="grupo-input">
                    <label for="lastname">Apellido:</label>
                    <input id="lastname" name="lastname" type="text" required>
                </div>
                <div id="email-input" class="grupo-input">
                    <label for="email">Correo Electrónico:</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div id="phone-input" class="grupo-input">
                    <label for="phone">Número de Teléfono:</label>
                    <input id="phone" name="phone" type="tel" required>
                </div>
                <div class="grupo-input">
                    <label for="type">Tipo de Usuario:</label>
                    <select id="type" name="type" required>
                        <option value="">-- Seleccione un tipo --</option>
                        <option value="pregrado">Estudiante Pregrado</option>
                        <option value="postgrado">Estudiante Postgrado</option>
                        <option value="funcionario">Funcionario</option>
                        <option value="academico">Académico</option>
                    </select>
                </div>
                <div id="campos-pregrado" class="grupo-input" hidden>
                    <label for="carrera">Carrera:</label>
                    <input id="carrera" name="carrera" type="text">
                </div>
                <div id="campos-postgrado" class="grupo-input" hidden>
                    <label for="programa">Programa de Postgrado:</label>
                    <input id="programa" name="programa" type="text">
                </div>
                <div id="campos-funcionario" class="grupo-input" hidden>
                    <label for="departamento">Departamento:</label>
                    <input id="departamento" name="departamento" type="text">
                </div>
                <div id="campos-academico" class="grupo-input" hidden>
                    <label for="asignatura">Asignatura:</label>
                    <input id="asignatura" name="asignatura" type="text">
                </div>
                <div id="password-input" class="grupo-input">
                    <label for="password">Contraseña (mínimo 6 caracteres):</label>
                    <input id="password" name="password" type="password" required>
                </div>
                <div class="botones">
                    <button type="button" id="envio" onclick="validarForm()">
                        Registrar
                    </button>
                </div  >
            </form>
        </main>
        <script src="validador.js"></script>
    </body>
</html>
