<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8"/>
        <title>Recreación UChile - Registro</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <main class="container">
            <header>
                <h1>Registro de Usuario</h1>
            </header>
            <div id="val-box-registro" class="validation-box" hidden>
                <h2 id="val-msg-registro" class="validation-message"></h2>
                <ul id="val-list-registro" class="validation-list"></ul>
            </div>
            <form name="myForm" class="formulario" action="#" method="POST">
                <h2>Información Personal</h2>
                <div id="name-input" class="grupo-input">
                    <label for="name">Nombre:</label>
                    <input id="name" name="name" type="text">
                </div>
                <div id="lastname-input" class="grupo-input">
                    <label for="lastname">Apellido:</label>
                    <input id="lastname" name="lastname" type="text">
                </div>
                <div id="email-input" class="grupo-input">
                    <label for="email">Correo Electrónico:</label>
                    <input id="email" name="email" type="email">
                </div>
                <div id="phone-input" class="grupo-input">
                    <label for="phone">Número de Teléfono:</label>
                    <input id="phone" name="phone" type="tel">
                </div>
                <div id="password-input" class="grupo-input">
                    <label for="password">Contraseña (mínimo 6 caracteres):</label>
                    <input id="password" name="password" type="password">
                </div>
                <div class="grupo-input">
                    <label for="type">Tipo de Usuario:</label>
                    <select id="type" name="type" onchange="mostrarCamposPorTipo()">
                        <option value="">-- Seleccione un tipo --</option>
                        <option value="Pregrado">Pregrado</option>
                        <option value="Postgrado">Postgrado</option>
                        <option value="Funcionario">Funcionario</option>
                        <option value="Academico">Académico</option>
                    </select>
                </div>

                <section id="campos-estudiante" class="campos-condicionales" hidden>
                    <div class="grupo-input">
                        <label for="carrera">Carrera:</label>
                        <input id="carrera" name="carrera" type="text">
                    </div>
                    <div class="grupo-input">
                        <label for="anio-ingreso">Año de Ingreso:</label>
                        <input id="anio-ingreso" name="anio-ingreso" type="number" min="1900" max="2030">
                    </div>
                </section>

                <section id="campos-funcionario" class="campos-condicionales" hidden>
                    <div class="grupo-input">
                        <label for="departamento">Departamento:</label>
                        <input id="departamento" name="departamento" type="text">
                    </div>
                    <div class="grupo-input">
                        <label for="cargo">Cargo:</label>
                        <input id="cargo" name="cargo" type="text">
                    </div>
                </section>

                <section id="campos-academico" class="campos-condicionales" hidden>
                    <div class="grupo-input">
                        <label for="area">Área de Investigación:</label>
                        <input id="area" name="area" type="text">
                    </div>
                    <div class="grupo-input">
                        <label for="grado">Grado Académico:</label>
                        <select id="grado" name="grado">
                            <option value="">-- Seleccione --</option>
                            <option value="Licenciado">Licenciado</option>
                            <option value="Magister">Magíster</option>
                            <option value="Doctor">Doctor</option>
                        </select>
                    </div>
                </section>

                <div class="botones">
                    <button type="button" id="envio" onclick="validarFormRegistro()">
                        Registrar
                    </button>
                </div>
            </form>
        </main>
        <script src="validador.js"></script>
    </body>
</html>
