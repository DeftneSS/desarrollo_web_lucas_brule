<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Recreación UChile</title>
        <link rel="stylesheet" type="text/css" href="styles.css">
    </head>
    <body>
        <main class="container">
            <h1>Registrar actividades</h1>
            <div id="val-box-actividades" class="validation-box" hidden>
                <h2 id="val-msg-actividades" class="validation-message"></h2>
                <ul id="val-list-actividades" class="validation-list"></ul>
            </div>
            <form id="ActividadesForm" action="#" method="post" enctype="multipart/form-data">
                <legend>Información de la Actividad</legend>
                <div id="name-input" class="grupo-input">
                    <label for="name">Nombre de la Actividad:</label>
                    <input id="name" name="name" type="text" required>
                </div>
                <div id="description-input" class="grupo-input">
                    <label for="description">Descripción:</label>
                    <textarea id="description" name="description" rows="4" required></textarea>
                </div>
                <div id="date-input" class="grupo-input">
                    <label for="date">Fecha:</label>
                    <input id="date" name="date" type="date" required>
                </div>
                <div id="file-input" class="grupo-input">
                    <label for="file">Subir Archivo:</label>
                    <input id="file" name="file" type="file" accept="image/*,.pdf" required>
                </div>
                <div id="link-input" class="grupo-input">
                    <label for="link">Link actividad:</label>
                    <input id="link" name="link" type="url" required>
                </div>
                <div class="botones">
                    <button type="button" id="envio-actividades" onclick="validarFormActividades()">
                        Enviar
                    </button>
                </div>
            </form>
        </main>
        <script src="validador.js"></script>
    </body>
</html>
