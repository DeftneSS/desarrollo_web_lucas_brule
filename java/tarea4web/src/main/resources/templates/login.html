<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Recreación UChile - Iniciar Sesión</title>
        <link rel="stylesheet" th:href="@{/styles.css}">
    </head>
    <body>
        <main class="container">
            <header>
                <h1>Iniciar Sesión</h1>
            </header>

            <div th:if="${error}"
                 style="background:#f8d7da;border:1px solid #721c24;color:#721c24;padding:15px;margin-bottom:20px;border-radius:5px;">
                <p th:text="${error}">Error</p>
            </div>

            <form class="formulario" th:action="@{/login}" method="post">
                <div class="grupo-input">
                    <label for="email">Correo Electrónico:</label>
                    <input id="email" name="email" type="email" th:value="${email}" required>
                </div>
                <div class="grupo-input">
                    <label for="password">Contraseña:</label>
                    <input id="password" name="password" type="password" required>
                </div>
                <div class="botones">
                    <button type="submit">Entrar</button>
                    <a href="/" class="btn-volver">Volver</a>
                </div>
            </form>
        </main>
    </body>
</html>
